{% extends "base.html" %}
{% block title %}Категории{% endblock %}
{% block content %}
<h1>Категории</h1>
{% for category in categories %}
<p><a href="{% url 'articles:by_category' category.slug %}">{{ category.name }}</a> ({{ category.total }})</p>
{% empty %}<p>Категорий нет.</p>{% endfor %}
{% endblock %}
